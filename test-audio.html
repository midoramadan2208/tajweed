<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الصوت</title>
<style>body{font-family:Tahoma,sans-serif;max-width:480px;margin:20px auto;padding:0 14px;line-height:1.9}button,audio{width:100%;margin:8px 0}button{font-size:18px;padding:12px}#r{padding:12px;border-radius:10px;background:#eee;white-space:pre-wrap}</style></head>
<body>
<h2>اختبار تشغيل الصوت من موقعك</h2>
<p>اضغط الزر، ثم انتظر حتى 20 ثانية، وانظر النتيجة في المربع الرمادي.</p>
<button id="b">▶ شغّل سورة الكوثر</button>
<audio id="a" controls preload="none"></audio>
<div id="r">لم يبدأ الاختبار بعد.</div>
<script>
const a=document.getElementById("a"),r=document.getElementById("r");
const log=t=>r.textContent+="\n"+t;
a.addEventListener("loadstart",()=>log("بدأ التحميل…"));
a.addEventListener("loadedmetadata",()=>log("تم الاتصال بالملف. المدة: "+Math.round(a.duration)+" ثانية"));
a.addEventListener("canplay",()=>log("الملف جاهز للتشغيل ✅"));
a.addEventListener("playing",()=>log("الصوت يعمل ✅✅"));
a.addEventListener("error",()=>log("فشل التشغيل ❌ رمز الخطأ: "+(a.error?a.error.code:"؟")+" (4 = المتصفح لا يستطيع فتح الملف أو الموقع يمنعه)"));
document.getElementById("b").onclick=()=>{r.textContent="بدأ الاختبار…";a.src="https://archive.org/download/alhosari_____--morattal-madd---almonfasel--114--sorah---full--mp3/108.mp3";a.play().catch(e=>log("المتصفح رفض التشغيل التلقائي: "+e.name))};
</script></body></html>
